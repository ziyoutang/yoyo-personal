<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow"><title>Yoyo — Private preview</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,sans-serif;color:#125485;background:#fff}
    #gate{min-height:100svh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at center,#fff2d8,transparent 65%)}
    .card{text-align:center;max-width:430px}h1{font-size:48px;margin:0 0 12px;letter-spacing:-2px}p{color:#415363}
    button{border:1px solid #125485;background:white;color:#125485;border-radius:8px;padding:12px 20px;font:inherit;cursor:pointer}button:hover{background:#f1f6fa}button:disabled{opacity:.6;cursor:wait}button:focus-visible{outline:3px solid #3771c8;outline-offset:3px}
    [hidden]{display:none!important}#status{min-height:48px;font-size:14px}#account-bar{position:fixed;bottom:10px;left:12px;z-index:2;display:flex;gap:10px;align-items:center;padding:5px 10px;background:#fffffff2;border:1px solid #eee;border-radius:8px;font-size:12px}#account-bar button{padding:4px 8px;font-size:12px}
    iframe{display:block;width:100%;height:100svh;border:0}#switch-account{margin-top:10px}
  </style>
  <script type="module" src="/auth.js"></script>
</head>
<body>
  <main id="gate"><div class="card"><h1>Yoyo</h1><p>A private preview of the portfolio.</p><button id="sign-in">Continue with Google</button><p id="status" role="status" aria-live="polite">Sign in with an invited Google account.</p><button id="switch-account" hidden>Use another account</button></div></main>
  <div id="account-bar" hidden><span id="account"></span><button id="sign-out">Sign out</button></div>
</body>
</html>
